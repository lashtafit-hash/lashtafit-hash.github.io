<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080611">
<title>WATCH•ME CREATIVE — New York After Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080611;color:#fff;font-family:Manrope,Arial,sans-serif}
.scene,.skyline,.city-filter,.city-light,.logo-reveal,.glow,.cover,.canvas,.vignette{position:fixed;inset:0}
.skyline{background-image:url("https://commons.wikimedia.org/wiki/Special:FilePath/Night_skyline_of_NYC_with_Empire_State_Building.jpg?width=1600");background-position:center 46%;background-size:cover;filter:saturate(1.2) contrast(1.06);transform:scale(1.15);opacity:0;animation:city-in 4.5s ease-out forwards}
.city-filter{background:linear-gradient(180deg,rgba(8,6,14,.34),rgba(12,6,20,.07) 40%,rgba(8,4,15,.76)),linear-gradient(90deg,rgba(15,4,25,.36),transparent 50%,rgba(12,4,20,.26));opacity:0;animation:shade-in 4s ease forwards}
.city-light{background:radial-gradient(ellipse at 50% 55%,rgba(255,99,168,.23),transparent 66%);mix-blend-mode:screen;opacity:0;animation:shade-in 2s .7s forwards}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.vignette{pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(3,2,8,.52))}
.logo-reveal{display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(180deg,rgba(10,5,21,.75),rgba(8,4,17,.91)),radial-gradient(ellipse at 50% 52%,rgba(111,38,90,.55),transparent 70%);opacity:0;transform:scale(1.08);pointer-events:none;transition:opacity .65s ease,transform 1.4s ease}
.logo-reveal.show{opacity:1;transform:scale(1)}
.logo-reveal h1{font-weight:800;font-size:clamp(40px,10vw,128px);letter-spacing:-.09em;line-height:1.04;margin:0;text-shadow:0 5px 55px rgba(255,105,185,.24)}
.logo-reveal h1 span{color:#ff9ac8}.logo-reveal p{font-size:clamp(10px,1.4vw,16px);letter-spacing:.25em;margin:25px 0 0;color:#e9c4d9;text-transform:uppercase}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 25px) clamp(24px,6vw,75px);z-index:9;font-size:12px;font-weight:800;letter-spacing:.12em}
nav span span{color:#ff95c6}.sub{color:#f5cde0;font-size:10px;font-weight:600;letter-spacing:.15em}
.actions{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 37px);left:0;right:0;display:flex;gap:10px;justify-content:center;z-index:10}
button{border-radius:40px;border:1px solid rgba(255,214,238,.48);background:rgba(12,8,22,.5);backdrop-filter:blur(12px);color:#fff;padding:13px 23px;font:700 12px Manrope,sans-serif;letter-spacing:.05em;cursor:pointer}
button.primary{background:#f8d8e8;color:#251021;border-color:#f8d8e8}
.progress{height:2px;position:fixed;bottom:0;left:0;width:0;background:#ff9fc9;z-index:12;box-shadow:0 0 18px #ff9fc9}
.credit{position:fixed;bottom:8px;right:12px;z-index:10;opacity:.35;font-size:8px;color:#fff;text-decoration:none}
@keyframes city-in{0%{opacity:0;transform:scale(1.15);filter:brightness(.3) saturate(.8)}22%{opacity:.7}48%{opacity:1;filter:brightness(.73) saturate(1)}100%{opacity:1;transform:scale(1.035);filter:brightness(1.08) saturate(1.16)}}
@keyframes shade-in{to{opacity:1}}
@media(max-width:600px){.skyline{background-position:53% 45%}.sub{font-size:8px}.logo-reveal h1{font-size:clamp(40px,10vw,62px)}}
@media(prefers-reduced-motion:reduce){.skyline{animation:none;opacity:1;transform:none}.city-filter{animation:none;opacity:1}.logo-reveal{transition:none}}
</style></head><body>
<div class="scene"><div class="skyline" id="skyline"></div><div class="city-filter"></div><div class="city-light"></div><canvas id="particles"></canvas><div class="vignette"></div><div class="logo-reveal" id="logo"><div><h1>WATCH<span>•</span>ME<br>CREATIVE</h1><p>We make ideas impossible to ignore.</p></div></div></div>
<nav><span>WATCH<span>•</span>ME CREATIVE</span><span class="sub">NEW YORK / AFTER DARK</span></nav>
<div class="actions"><button id="replay">↻ Replay</button><button class="primary" id="enter">Enter studio ↗</button></div><div class="progress" id="progress"></div>
<a class="credit" href="https://commons.wikimedia.org/wiki/File:Night_skyline_of_NYC_with_Empire_State_Building.jpg" target="_blank" rel="noopener">NYC photo © Mike Sinko / CC BY 2.0</a>
<script>
(()=>{const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),logo=document.getElementById('logo'),bar=document.getElementById('progress'),sky=document.getElementById('skyline');let dots=[],w,h,dpr,raf,start=performance.now(),finished=false;
const DURATION=4400,random=(a,b)=>a+Math.random()*(b-a),smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);dots=[];for(let i=0;i<(w<700?430:950);i++){const x=random(0,w),y=random(0,h),a=random(0,6.28);dots.push({x,y,fromX:w/2+Math.cos(a)*random(w*.4,w*1.5),fromY:h/2+Math.sin(a)*random(h*.4,h*1.4),a:random(.2,.9),r:random(.5,2),phase:random(0,6.28),delay:random(0,.45)})}}
function draw(now){const t=Math.min(1,(now-start)/DURATION);ctx.clearRect(0,0,w,h);const gather=smooth(t/.48),fade=1-smooth((t-.58)/.18),depart=smooth((t-.55)/.3);
ctx.globalCompositeOperation='lighter';for(const p of dots){let u=smooth((gather-p.delay)/(1-p.delay));let x=p.fromX+(p.x-p.fromX)*u,y=p.fromY+(p.y-p.fromY)*u;if(depart){x+=(w/2-x)*depart;y+=(h*.48-y)*depart}ctx.globalAlpha=p.a*fade*(.75+.25*Math.sin(now*.006+p.phase));ctx.fillStyle=p.phase<1.9?'#ff99c5':p.phase<3.8?'#fff1df':'#d1bdff';ctx.beginPath();ctx.arc(x,y,p.r*(1+.6*depart),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
if(t>.58)logo.classList.add('show');bar.style.width=(100*t)+'%';if(t<1){raf=requestAnimationFrame(draw)}else{finished=true;ctx.clearRect(0,0,w,h)}}
function replay(){cancelAnimationFrame(raf);finished=false;logo.classList.remove('show');bar.style.width='0';sky.style.animation='none';void sky.offsetWidth;sky.style.animation='city-in 4.5s ease-out forwards';start=performance.now();raf=requestAnimationFrame(draw)}
document.getElementById('replay').onclick=replay;document.getElementById('enter').onclick=()=>location.href='./index.html#services';
addEventListener('resize',resize,{passive:true});resize();if(matchMedia('(prefers-reduced-motion:reduce)').matches){logo.classList.add('show');bar.style.width='100%'}else{raf=requestAnimationFrame(draw)}
})();
</script></body></html>
