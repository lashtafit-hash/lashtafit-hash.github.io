<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080715">
<title>WATCH•ME CREATIVE — A New York Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080715;color:#fff;font-family:Manrope,Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%}
#scene canvas{display:block;width:100%;height:100%}
#atmosphere{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 48% at 50% 55%,transparent 45%,rgba(5,3,14,.30) 100%),linear-gradient(180deg,rgba(7,5,15,.12),transparent 24%,transparent 76%,rgba(6,4,12,.20))}
#intro-label{position:fixed;z-index:3;top:calc(24px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.32em;font-weight:700;color:#ffe5ef;text-shadow:0 2px 25px #0008;opacity:.7;transition:opacity .7s}
#intro-label.hidden{opacity:0}
#progress{position:fixed;z-index:5;bottom:0;left:0;width:0;height:2px;background:#ffa5c8;box-shadow:0 0 18px #ff9fcc}
#controls{position:fixed;z-index:6;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px}
button{font:700 12px Manrope,Arial,sans-serif;padding:13px 20px;border-radius:99px;border:1px solid #f4c7db80;background:#140e1dc9;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;cursor:pointer}
button.primary{color:#241221;background:#f8dbe9;border-color:#f8dbe9}
#fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:radial-gradient(ellipse at 50% 55%,#492442,#080715 70%);z-index:2}
#fallback strong{font:800 clamp(30px,8vw,70px) Manrope,sans-serif;letter-spacing:-.07em}
#fallback p{font-size:12px;color:#eccbdd}
@media(max-width:500px){#intro-label{font-size:9px;letter-spacing:.19em}}
</style></head>
<body>
<div id="scene"></div><div id="atmosphere"></div><div id="intro-label">NEW YORK · AFTER DARK</div>
<div id="fallback"><div><strong>WATCH•ME CREATIVE</strong><p>Open this scene in a browser with WebGL enabled</p></div></div>
<div id="controls"><button id="replay">↻ Replay</button><button id="enter" class="primary">Enter studio ↗</button></div><div id="progress"></div>
<script>
window.__introReady=false;
setTimeout(()=>{if(!window.__introReady)document.getElementById('fallback').style.display='grid'},7000);
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const area=document.querySelector('#scene'),indicator=document.querySelector('#progress'),label=document.querySelector('#intro-label');
const PI=Math.PI, duration=8400, mobile=matchMedia('(max-width: 700px)').matches;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),smooth=v=>{v=clamp(v);return v*v*(3-2*v)},mix=(a,b,t)=>a+(b-a)*t;
let seed=73191;const random=()=>{seed=seed*16807%2147483647;return(seed-1)/2147483646};
let renderer,scene,camera,particles,cityGeo,cityMat,cityBuildings=[],fadeMaterials=[],tower,glowMat,windowMaterial,instancedWindows,roadReflections=[],sparkles=[],lights=[],frameId=0,t0=performance.now(),isDone=false;
function fail(e){console.error('NYC intro',e);document.getElementById('fallback').style.display='grid';}
try {
renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance',alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.5:1.8));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;area.appendChild(renderer.domElement);
scene=new THREE.Scene();scene.background=new THREE.Color(0x090819);scene.fog=new THREE.FogExp2(0x171126,.0020);
camera=new THREE.PerspectiveCamera(mobile?70:64,innerWidth/innerHeight,.1,620);
const ambient=new THREE.HemisphereLight(0xd7d0ff,0x482537,2.7);scene.add(ambient);
const key=new THREE.DirectionalLight(0xffc5dd,2.1);key.position.set(-25,74,45);scene.add(key);
const rim=new THREE.DirectionalLight(0x9eaeff,1.25);rim.position.set(35,45,-130);scene.add(rim);
const goldLight=new THREE.PointLight(0xffd8a6,230,145);goldLight.position.set(-13,19,-95);scene.add(goldLight);
const pinkLight=new THREE.PointLight(0xff8dc9,255,170);pinkLight.position.set(12,44,-174);scene.add(pinkLight);
const facadeColors=[0x39303b,0x3c3542,0x263044,0x453543,0x353143,0x4b3c44,0x313849];
const facades=facadeColors.map(color=>new THREE.MeshStandardMaterial({color,metalness:.14,roughness:.73,transparent:true,opacity:0}));
fadeMaterials.push(...facades);
function meshBox(group,x,y,z,w,h,d,mat){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);group.add(m);return m;}
const newMaterial=(color,emissive=0x000000)=>{const mat=new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:.35,roughness:.64,metalness:.22,transparent:true,opacity:0});fadeMaterials.push(mat);return mat};
const trimMat=newMaterial(0x777083,0x362b42),archMat=newMaterial(0x65546b),crownMat=newMaterial(0x9c879b,0x9d4a79),spireMat=new THREE.MeshBasicMaterial({color:0xffe4be,transparent:true,opacity:0});
const decoStone=newMaterial(0x9a8597,0x562c4c);
const buildingGroup=new THREE.Group();scene.add(buildingGroup);
const cityWindows=[];
function building(side,row,i,z){
const lot=side*(17.8+row*11.4+random()*1.6),w=8.5+random()*1.65,d=8.5+random()*2.3;
const baseH=(row===0?27:35)+random()*(row===0?36:57);const h=baseH+(i%7===0?8:0);
const mat=facades[(i*3+row+(side>0?1:0))%facades.length];
meshBox(buildingGroup,lot,h/2,z,w,h,d,mat);
const roofStyle=i%4;
if(roofStyle===0){meshBox(buildingGroup,lot,h+1.3,z,w*.95,2.6,d*.94,trimMat);meshBox(buildingGroup,lot,h+3.7,z,w*.62,2.3,d*.65,archMat)}
if(roofStyle===1){meshBox(buildingGroup,lot,h+1,z,w*.82,2,d*.81,trimMat);meshBox(buildingGroup,lot,h+3,z,w*.42,2,d*.50,trimMat)}
if(roofStyle===2){for(let k=0;k<5;k++){let xx=lot-w*.45+k*w*.22;meshBox(buildingGroup,xx,h*.5,z+d*.505,.13,h,.16,trimMat)}}
if(roofStyle===3){for(let k=0;k<3;k++)meshBox(buildingGroup,lot,h*(.2+k*.2),z+d*.508,w*.92,.14,.22,trimMat)}
// Door arch at street level, readable sculpted frontage.
meshBox(buildingGroup,lot,2,z+d*.515,w*.35,4,.24,archMat);
const xSide=lot-side*(w*.5+.09);
for(let y=3.5;y<h-2;y+=2.35){
for(let zz=z-d/2+1;zz<z+d/2-1;zz+=1.8)if(random()>.24)cityWindows.push({x:xSide,y,z:zz,angle:PI/2,type:random()});
for(let xx=lot-w/2+1;xx<lot+w/2-1;xx+=1.75)if(random()>.28)cityWindows.push({x:xx,y,z:z+d/2+.08,angle:0,type:random()});
}
}
for(let i=0;i<24;i++){let z=133-i*12.4;for(const side of [-1,1])for(let row=0;row<3;row++)building(side,row,i,z)}
// Cinematic road and pavements, with long wet reflections.
const roadMat=new THREE.MeshStandardMaterial({color:0x20202c,metalness:.78,roughness:.17});
meshBox(scene,0,-.15,-38,25,.18,435,roadMat);
const pavement=new THREE.MeshStandardMaterial({color:0x35303a,metalness:.40,roughness:.48});
for(const side of [-1,1]){
meshBox(scene,side*14.5,-.08,-38,4.1,.18,430,pavement);
const curb=new THREE.MeshBasicMaterial({color:0x927285});meshBox(scene,side*12.25,.06,-38,.16,.08,430,curb);
}
const dashMat=new THREE.MeshBasicMaterial({color:0xf2c7a8});
for(let z=-232;z<130;z+=11)meshBox(scene,0,.01,z,.10,.024,3.3,dashMat);
// Narrow reflective strips on road, layered translucent, no colored squares.
const reflColors=[0xffd4b4,0xe890c2,0xa69fe1];
for(let k=0;k<500;k++){
const z=-232+random()*363,x=(random()-.5)*18,ww=.035+random()*.09,dd=.5+random()*4.4;
const color=reflColors[Math.floor(random()*3)],mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.08+random()*.22,depthWrite:false});
meshBox(scene,x,.013+random()*.02,z,ww,.008,dd,mat);
}
// ESB as genuine permanent end-of-avenue architecture, never introduced as a late object.
tower=new THREE.Group();tower.position.set(0,0,-238);scene.add(tower);
function towerBox(w,h,d,y,mat){return meshBox(tower,0,y,0,w,h,d,mat)}
towerBox(25,78,23,39,decoStone);
towerBox(20.5,13,19,84.5,decoStone);towerBox(16,11,15,96.5,decoStone);
towerBox(12,11,11,107.5,crownMat);towerBox(7.3,10,7.3,118,crownMat);
towerBox(4.2,9,4.2,127.5,crownMat);
towerBox(1.65,28,1.65,146,spireMat);towerBox(.5,9,.5,164,spireMat);
for(let i=0;i<6;i++){let width=24-i*3.3,depth=22-i*2.85;meshBox(tower,0,79+i*6,0,Math.max(width,5),.7,Math.max(depth,4),crownMat)}
const towerWindowPositions=[];
for(let y=3.5;y<78;y+=2.14){
for(let x=-11;x<=11;x+=1.48)if(random()>.10){towerWindowPositions.push([x,y,11.65,0]);towerWindowPositions.push([x,y,-11.65,0])}
for(let z=-10.4;z<=10.4;z+=1.6)if(random()>.12){towerWindowPositions.push([-12.65,y,z,PI/2]);towerWindowPositions.push([12.65,y,z,PI/2])}
}
for(let y=81;y<115;y+=2.2)for(let x=-8.5;x<8.5;x+=1.55)towerWindowPositions.push([x,y,9.9,0]);
// All illuminated windows in one GPU-instanced draw; thin shapes and gentle color variation.
const allWindows=cityWindows.concat(towerWindowPositions.map(v=>({x:v[0],y:v[1],z:v[2]-238,angle:v[3],type:random(),tower:true})));
const windowGeometry=new THREE.PlaneGeometry(.62,1.23);
windowMaterial=new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:0,depthWrite:false});
instancedWindows=new THREE.InstancedMesh(windowGeometry,windowMaterial,allWindows.length);
instancedWindows.frustumCulled=false;scene.add(instancedWindows);
const dummy=new THREE.Object3D(),windowPalette=[new THREE.Color('#ffe3b7'),new THREE.Color('#fff4df'),new THREE.Color('#eab4d6'),new THREE.Color('#c5c9ed')];
for(let i=0;i<allWindows.length;i++){let v=allWindows[i];dummy.position.set(v.x,v.y,v.z);dummy.rotation.set(0,v.angle,0);dummy.updateMatrix();instancedWindows.setMatrixAt(i,dummy.matrix);instancedWindows.setColorAt(i,windowPalette[Math.min(3,Math.floor(v.type*4))])}
instancedWindows.instanceMatrix.needsUpdate=true;instancedWindows.instanceColor.needsUpdate=true;
// Warm bokeh streetlamps along the avenue, without giant rectangular shop signs.
const lampStem=new THREE.MeshStandardMaterial({color:0x534851,roughness:.5});
const lampGlass=new THREE.MeshBasicMaterial({color:0xffd5b1});
const lampBulbs=[];
for(let z=-206;z<126;z+=23)for(const side of [-1,1]){
let x=side*12.8;
const post=new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,6.6,7),lampStem);post.position.set(x,3.3,z);scene.add(post);
const bracket=meshBox(scene,x-side*.68,6.55,z,1.5,.10,.12,lampStem);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.28,7,6),lampGlass);bulb.position.set(x-side*1.35,6.42,z);scene.add(bulb);lampBulbs.push(bulb);
if((Math.round(z/23)%4)===0){const p=new THREE.PointLight(0xffd2ac,13,26);p.position.set(x-side*1.35,6.4,z);scene.add(p)}
}
// Floating glitter in real world space (tiny, scattered and subtle).
const dustCount=mobile?1300:2500,dustCoords=new Float32Array(dustCount*3);
for(let i=0;i<dustCoords.length;i+=3){dustCoords[i]=(random()-.5)*75;dustCoords[i+1]=random()*55;dustCoords[i+2]=130-random()*350}
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustCoords,3));
const dustMat=new THREE.PointsMaterial({color:0xf7c5e0,size:1.2,sizeAttenuation:false,transparent:true,opacity:.26,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(dustGeo,dustMat));
// GPU shader: one set of points flies into windows, then same particles become the brand.
const NUM=mobile?36000:84000;
const origins=new Float32Array(NUM*3),destinations=new Float32Array(NUM*3),finals=new Float32Array(NUM*3),color=new Float32Array(NUM*3),delay=new Float32Array(NUM);
const particlePalette=[new THREE.Color('#ffbfdf'),new THREE.Color('#ffe3b8'),new THREE.Color('#fff4e9'),new THREE.Color('#c4caff')];
for(let i=0;i<NUM;i++){
const j=i*3,v=allWindows[i%allWindows.length],ang=random()*PI*2,radius=65+random()*195;
origins[j]=Math.cos(ang)*radius;origins[j+1]=-20+random()*190;origins[j+2]=-40+Math.sin(ang)*radius;
destinations[j]=v.x;destinations[j+1]=v.y;destinations[j+2]=v.z;
const c=particlePalette[Math.floor(random()*4)];color[j]=c.r;color[j+1]=c.g;color[j+2]=c.b;delay[i]=random()*.25;
}
cityGeo=new THREE.BufferGeometry();
cityGeo.setAttribute('position',new THREE.BufferAttribute(origins,3));
cityGeo.setAttribute('aCity',new THREE.BufferAttribute(destinations,3));
cityGeo.setAttribute('aLogo',new THREE.BufferAttribute(finals,3));
cityGeo.setAttribute('color',new THREE.BufferAttribute(color,3));
cityGeo.setAttribute('aDelay',new THREE.BufferAttribute(delay,1));
const vertex=[
'attribute vec3 aCity;attribute vec3 aLogo;attribute float aDelay;attribute vec3 color;',
'uniform float uBuild;uniform float uMorph;uniform float uTime;uniform float uPixelRatio;',
'varying vec3 vColor;varying float vAlpha;',
'float ease(float x){x=clamp(x,0.0,1.0);return x*x*(3.0-2.0*x);}',
'void main(){',
'float b=ease((uBuild-aDelay)/(1.0-aDelay));',
'vec3 p=mix(position,aCity,b);p=mix(p,aLogo,uMorph);',
'vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;',
'float pix=mix(clamp(75.0/(-mv.z),1.0,2.6),1.55,uMorph);',
'gl_PointSize=pix*uPixelRatio;',
'vColor=color;vAlpha=mix(b,1.0,uMorph)*(.80+.20*sin(uTime*3.0+aDelay*63.0));',
'}'
].join('\n');
const fragment=[
'precision mediump float;varying vec3 vColor;varying float vAlpha;',
'void main(){vec2 p=gl_PointCoord-0.5;float d=length(p);',
'float a=1.0-smoothstep(0.21,0.5,d);',
'gl_FragColor=vec4(vColor,a*vAlpha);}'
].join('\n');
cityMat=new THREE.ShaderMaterial({vertexShader:vertex,fragmentShader:fragment,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{
uBuild:{value:0},uMorph:{value:0},uTime:{value:0},uPixelRatio:{value:renderer.getPixelRatio()}}});
particles=new THREE.Points(cityGeo,cityMat);particles.frustumCulled=false;scene.add(particles);
function setCamera(t){
const fly=smooth((t-.30)/.42);
camera.position.set(Math.sin(fly*PI)*1.8,mix(31,12,fly),mix(177,-30,fly));
camera.lookAt(0,mix(51,64,fly),-238);
}
function size(){
const w=innerWidth,h=innerHeight;
renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
setCamera(.9);camera.updateMatrixWorld();
const off=document.createElement('canvas');off.width=w;off.height=h;const g=off.getContext('2d',{willReadFrequently:true});
g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
let sz=Math.min(w*.147,122);g.font='800 '+sz+'px Manrope';
while(g.measureText('WATCH•ME').width>w*.92&&sz>23){sz-=1;g.font='800 '+sz+'px Manrope'}
g.fillText('WATCH•ME',w/2,h*.44-sz*.43);g.font='800 '+sz*.95+'px Manrope';
g.fillText('CREATIVE',w/2,h*.44+sz*.76);
const pix=g.getImageData(0,0,w,h).data,targets=[],stride=mobile?2:3;
for(let y=0;y<h;y+=stride)for(let x=0;x<w;x+=stride){if(pix[(y*w+x)*4+3]>130)targets.push([x,y])}
if(!targets.length)throw Error('Could not sample logo');
const camRot=camera.quaternion.clone(),camPos=camera.position.clone();
const d=26,halfH=Math.tan(camera.fov*PI/360)*d,halfW=halfH*camera.aspect;
const vec=new THREE.Vector3();
for(let i=0;i<NUM;i++){const ix=i*3,q=targets[i%targets.length];
const xx=(q[0]/w-.5)*2*halfW, yy=(.5-q[1]/h)*2*halfH;
vec.set(xx,yy,-d).applyQuaternion(camRot).add(camPos);
finals[ix]=vec.x;finals[ix+1]=vec.y;finals[ix+2]=vec.z}
cityGeo.attributes.aLogo.needsUpdate=true;
}
function draw(now){
const t=clamp((now-t0)/duration),build=smooth(t/.26),morph=smooth((t-.79)/.19);
setCamera(t);
const worldAlpha=smooth((t-.09)/.20)*(1-morph);
for(const mat of fadeMaterials)mat.opacity=worldAlpha;
spireMat.opacity=Math.max(.38*build,worldAlpha)*(1-morph);
windowMaterial.opacity=smooth((t-.03)/.25)*(1-morph);
cityMat.uniforms.uBuild.value=build;cityMat.uniforms.uMorph.value=morph;cityMat.uniforms.uTime.value=now*.001;
dustMat.opacity=.27*(1-morph);
goldLight.intensity=230*(1-morph);pinkLight.intensity=255*(1-morph);
renderer.render(scene,camera);
indicator.style.width=Math.round(t*100)+'%';
if(t>.76)label.classList.add('hidden');else label.classList.remove('hidden');
if(t<1){frameId=requestAnimationFrame(draw)}else{isDone=true}
}
function replay(){cancelAnimationFrame(frameId);t0=performance.now();isDone=false;frameId=requestAnimationFrame(draw)}
document.getElementById('replay').addEventListener('click',replay);
document.getElementById('enter').addEventListener('click',()=>location.href='./index.html#services');
window.addEventListener('resize',()=>{size();replay()},{passive:true});
document.fonts.ready.then(()=>{size();window.__introReady=true;frameId=requestAnimationFrame(draw)});
}catch(error){fail(error)}
</script>
</body></html>
