<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WATCH•ME CREATIVE — 3D NYC</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;background:#090712;overflow:hidden;color:white;font-family:Manrope,sans-serif}#scene,canvas{position:fixed;inset:0;width:100%;height:100%}canvas{display:block}#text{position:fixed;top:39%;left:0;right:0;text-align:center;font:800 clamp(40px,10vw,100px)/1.05 Manrope,sans-serif;letter-spacing:-.07em;opacity:0;pointer-events:none;text-shadow:0 0 35px #ff8dc5}#text em{color:#ff9bca;font-style:normal}nav{position:fixed;top:25px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 10px black}nav small{color:#ffbbdb;font-size:9px}footer{position:fixed;bottom:25px;left:0;right:0;display:flex;gap:10px;justify-content:center}button{border-radius:50px;padding:13px 20px;background:#170c20dd;color:#fff;border:1px solid #ffcee1;font:700 12px Manrope,sans-serif}button:nth-child(2){background:#f6ddeb;color:#241024}#bar{position:fixed;bottom:0;left:0;height:2px;background:#ff93be;width:0}</style></head><body><div id="scene"></div><canvas id="overlay"></canvas><div id="text">WATCH<em>•</em>ME<br>CREATIVE</div><nav><span>WATCH•ME CREATIVE</span><small>NYC / AFTER DARK</small></nav><footer><button id="again">↻ Replay</button><button id="enter">Enter studio ↗</button></footer><div id="bar"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const el=document.getElementById('scene'),overlay=document.getElementById('overlay'),ctx=overlay.getContext('2d'),text=document.getElementById('text'),bar=document.getElementById('bar');
let scene,camera,renderer,points,positions,origin,destination,meshes=[],dots=[],towerDots=[],start=performance.now(),raf;
const mobile=innerWidth<700,PI=Math.PI,clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const run=7600;
try{
scene=new THREE.Scene();scene.background=new THREE.Color('#090712');scene.fog=new THREE.FogExp2(0x120b21,.0042);
camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,450);
renderer=new THREE.WebGLRenderer({powerPreference:'high-performance',antialias:!mobile});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);el.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe0c9ff,0x3d2340,2.5));const light=new THREE.PointLight(0xff77b9,240,190);light.position.set(-8,40,-45);scene.add(light);const light2=new THREE.PointLight(0xffd5ae,150,145);light2.position.set(8,22,-92);scene.add(light2);
const material=new THREE.MeshStandardMaterial({color:0x272136,metalness:.3,roughness:.6,transparent:true,opacity:0});
const secondary=new THREE.MeshStandardMaterial({color:0x192036,metalness:.4,roughness:.55,transparent:true,opacity:0});
function block(x,y,z,w,h,d,mat=material){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);meshes.push(m);return m}
let seed=1932;function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}
const windows=[];
for(let i=0;i<19;i++){const z=75-12*i;for(const side of [-1,1])for(let row=0;row<3;row++){
let x=side*(15+row*10+rnd()*2),w=7+rnd()*2,d=9+rnd()*2,h=24+rnd()*70;block(x,h/2,z,w,h,d,row%2?secondary:material);
for(let y=3;y<h-2;y+=2.8)for(let zz=z-d/2+1;zz<z+d/2-1;zz+=2.3)if(rnd()>.2)windows.push([x-side*w/2,y,zz]);
for(let y=3;y<h-2;y+=2.8)for(let xx=x-w/2+1;xx<x+w/2-1;xx+=2.3)if(rnd()>.25)windows.push([xx,y,z-d/2]);
}}
block(-24,45,-100,16,90,16);block(-24,95,-100,10,10,10);block(-24,103,-100,5,8,6);block(-24,120,-100,1,27,1);
block(28,53,-155,18,106,18,secondary);block(28,115,-155,10,18,10,secondary);block(28,137,-155,1,28,1,secondary);
block(35,43,-60,15,86,15);for(let i=0;i<5;i++)block(35,88+i*3,-60,14-i*2,3,14-i*2);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x170d20,roughness:.24,metalness:.7}));ground.rotation.x=-PI/2;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(18,350),new THREE.MeshStandardMaterial({color:0x11111d,metalness:.6,roughness:.2}));road.rotation.x=-PI/2;road.position.set(0,.03,-29);scene.add(road);
for(let z=-158;z<78;z+=12){const d=new THREE.Mesh(new THREE.PlaneGeometry(.25,3.5),new THREE.MeshBasicMaterial({color:0xffd2ab}));d.rotation.x=-PI/2;d.position.set(0,.07,z);scene.add(d)}
const n=mobile?38000:82000;origin=new Float32Array(n*3);destination=new Float32Array(n*3);positions=new Float32Array(n*3);const colors=new Float32Array(n*3);const palette=[new THREE.Color('#ffabd3'),new THREE.Color('#ffe2b7'),new THREE.Color('#c5c9ff')];
for(let i=0;i<n;i++){const j=i*3,w=windows[i%windows.length],angle=rnd()*2*PI,r=45+rnd()*140;destination[j]=w[0];destination[j+1]=w[1];destination[j+2]=w[2];origin[j]=Math.cos(angle)*r;origin[j+1]=-30+rnd()*160;origin[j+2]=-50+Math.sin(angle)*r;positions[j]=origin[j];positions[j+1]=origin[j+1];positions[j+2]=origin[j+2];const c=palette[Math.floor(rnd()*3)];colors[j]=c.r;colors[j+1]=c.g;colors[j+2]=c.b}
const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.BufferAttribute(positions,3));geom.setAttribute('color',new THREE.BufferAttribute(colors,3));points=new THREE.Points(geom,new THREE.PointsMaterial({size:mobile?1.5:1.7,sizeAttenuation:false,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));points.frustumCulled=false;scene.add(points);

// A landmark at the END OF THE STREET, not superimposed on the screen.
// The avenue remains open until the viewer reaches the brightly lit tower.

// Storefronts and lamps stay visibly luminous even when the building façades are dark.
const storeColors=[0xff8fc3,0xffd4b0,0xb7caff];
for(let z=62;z>-106;z-=13){
 for(const side of [-1,1]){
  const x=side*11.35;
  const storefront=new THREE.Mesh(new THREE.BoxGeometry(.2,3.4,5.9),new THREE.MeshBasicMaterial({color:storeColors[Math.abs(Math.round(z))%3],transparent:true,opacity:.75}));
  storefront.position.set(x,2.2,z);scene.add(storefront);
  const accent=new THREE.Mesh(new THREE.BoxGeometry(.25,.32,6.1),new THREE.MeshBasicMaterial({color:0xffe1ce}));
  accent.position.set(x,4.2,z);scene.add(accent);
  const halo=new THREE.PointLight(z%2?0xff7db6:0xffd7ae,12,16);halo.position.set(x-side*1.5,3,z);scene.add(halo);
 }
}
const heroTower=new THREE.Group();heroTower.position.set(0,0,-116);scene.add(heroTower);
const stone=new THREE.MeshStandardMaterial({color:0xa3a0af,emissive:0x624459,emissiveIntensity:.32,metalness:.3,roughness:.55,transparent:true,opacity:0});
const crown=new THREE.MeshBasicMaterial({color:0xffbddf,transparent:true,opacity:0});
const warm=new THREE.MeshBasicMaterial({color:0xffe3b2,transparent:true,opacity:0});
const windowsHero=[],heroParts=[];
function hbox(w,h,d,x,y,z,mat){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);heroTower.add(m);heroParts.push(m);return m}
function hline(w,h,d,x,y,z){hbox(w,h,d,x,y,z,crown)}
hbox(17,66,15,0,33,0,stone);hbox(14,11,14,0,71,0,stone);hbox(10,8,10,0,80,0,stone);hbox(7,7,7,0,87,0,stone);hbox(4,8,4,0,94,0,crown);hbox(1.1,26,1.1,0,110,0,crown);
for(let level=0;level<5;level++){let y=67+level*5.1,width=16-level*2.65;hline(width,.54,14-level*2.1,0,y,0)}
for(let y=3;y<65;y+=2.65)for(let x=-7.3;x<=7.3;x+=1.9){if(rnd()<.16)continue;windowsHero.push([x,y,7.62]);windowsHero.push([x,y,-7.62])}
for(let y=3;y<64;y+=2.65)for(let z=-6.5;z<=6.5;z+=1.9){if(rnd()<.19)continue;windowsHero.push([-8.65,y,z]);windowsHero.push([8.65,y,z])}
for(let y=68;y<92;y+=2.7)for(let x=-4.5;x<=4.5;x+=1.65){windowsHero.push([x,y,5]);}
const heroCount=mobile?16000:30000;
const heroStart=new Float32Array(heroCount*3),heroEnd=new Float32Array(heroCount*3),heroPos=new Float32Array(heroCount*3),heroColors=new Float32Array(heroCount*3);
const pc=[new THREE.Color('#ff9bca'),new THREE.Color('#ffe0ac'),new THREE.Color('#fff5e7'),new THREE.Color('#d9c4ff')];
for(let i=0;i<heroCount;i++){
const j=i*3,v=windowsHero[i%windowsHero.length],angle=rnd()*2*PI,r=16+rnd()*65;
heroEnd[j]=v[0];heroEnd[j+1]=v[1];heroEnd[j+2]=v[2];
heroStart[j]=Math.cos(angle)*r;heroStart[j+1]=rnd()*135-10;heroStart[j+2]=Math.sin(angle)*r;
heroPos[j]=heroStart[j];heroPos[j+1]=heroStart[j+1];heroPos[j+2]=heroStart[j+2];
const color=pc[Math.floor(rnd()*pc.length)];heroColors[j]=color.r;heroColors[j+1]=color.g;heroColors[j+2]=color.b
}
const heroGeo=new THREE.BufferGeometry();heroGeo.setAttribute('position',new THREE.BufferAttribute(heroPos,3));heroGeo.setAttribute('color',new THREE.BufferAttribute(heroColors,3));
const heroDots=new THREE.Points(heroGeo,new THREE.PointsMaterial({size:mobile?1.65:1.8,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
heroDots.frustumCulled=false;heroTower.add(heroDots);
const crownLight=new THREE.PointLight(0xff8ac3,260,100);crownLight.position.set(0,98,-116);scene.add(crownLight);
const heroLum=new THREE.PointLight(0xffd9b5,200,120);heroLum.position.set(0,48,-106);scene.add(heroLum);
function resize(){
const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,2);renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
overlay.width=w*dpr;overlay.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const off=document.createElement('canvas');off.width=w;off.height=h;const g=off.getContext('2d',{willReadFrequently:true});
g.textAlign='center';g.textBaseline='middle';g.fillStyle='white';let fs=Math.min(w*.143,108);g.font='800 '+fs+'px Manrope';
while(g.measureText('WATCH•ME').width>w*.9&&fs>24){fs--;g.font='800 '+fs+'px Manrope'}
g.fillText('WATCH•ME',w*.5,h*.43-fs*.42);g.font='800 '+fs*.94+'px Manrope';g.fillText('CREATIVE',w*.5,h*.43+fs*.75);
const data=g.getImageData(0,0,w,h).data,all=[];
for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(data[(y*w+x)*4+3]>145)all.push([x,y]);
dots=[];const cap=Math.min(all.length,mobile?10000:17000);
const oldPos=camera.position.clone(),oldQuat=camera.quaternion.clone();
camera.position.set(0,8,-21);camera.lookAt(0,44,-113);camera.updateMatrixWorld();
const v=new THREE.Vector3();
for(let i=0;i<cap;i++){let p=all[Math.floor(i*all.length/cap)],seed=i%heroCount,z=seed*3;
v.set(heroEnd[z],heroEnd[z+1],heroEnd[z+2]-116).project(camera);
dots.push({sx:(v.x*.5+.5)*w,sy:(-v.y*.5+.5)*h,tx:p[0],ty:p[1],radius:.38+Math.random()*.55,delay:Math.random()*.12})}
camera.position.copy(oldPos);camera.quaternion.copy(oldQuat);camera.updateMatrixWorld();
}
function frame(now){
const t=clamp((now-start)/run);
const assemble=smooth(t/.28),fly=smooth((t-.28)/.32),tower=smooth((t-.59)/.16),morph=smooth((t-.8)/.17);
for(let i=0;i<positions.length;i++)positions[i]=origin[i]+(destination[i]-origin[i])*assemble;
geom.attributes.position.needsUpdate=true;
const cityFade=smooth((t-.58)/.16);
for(const m of meshes)m.material.opacity=smooth((t-.10)/.19)*(1-cityFade*.72);
points.material.opacity=1-cityFade*.65;
if(t<.28){camera.position.set(0,56,170);camera.lookAt(0,36,-110)}
else{camera.position.set(Math.sin(fly*PI)*1.3,56-48*fly,170-191*fly);camera.lookAt(0,36+8*fly,-105-8*fly)}
// The final landmark stays anchored at world x=0, z=-116, directly down Fifth Avenue.
heroTower.visible=t>.51;
const heroFade=smooth((t-.78)/.17);
stone.opacity=tower*(1-heroFade);crown.opacity=tower*(1-heroFade);warm.opacity=tower*(1-heroFade);
for(let i=0;i<heroPos.length;i++)heroPos[i]=heroStart[i]+(heroEnd[i]-heroStart[i])*tower;
heroGeo.attributes.position.needsUpdate=true;
heroDots.material.opacity=tower*(1-heroFade);
renderer.render(scene,camera);
const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);
if(t>.77){
const p=smooth((t-.79)/.18);
ctx.globalCompositeOperation='lighter';
for(const d of dots){
const sx=d.sx,sy=d.sy;
let a=smooth((p-d.delay)/(1-d.delay));
ctx.globalAlpha=a;ctx.fillStyle=d.radius>.73?'#ffe3f0':'#ff9dce';
ctx.beginPath();ctx.arc(sx+(d.tx-sx)*a,sy+(d.ty-sy)*a,d.radius,0,2*PI);ctx.fill();
}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
if(t>.975)text.style.opacity=String(smooth((t-.975)/.025)*.36);
bar.style.width=t*100+'%';
if(t<1)raf=requestAnimationFrame(frame);
}
function replay(){cancelAnimationFrame(raf);start=performance.now();text.style.opacity='0';raf=requestAnimationFrame(frame)}
document.getElementById('again').onclick=replay;document.getElementById('enter').onclick=()=>location.href='./index.html#services';window.addEventListener('resize',resize);document.fonts.ready.then(()=>{resize();raf=requestAnimationFrame(frame)});
}catch(e){document.getElementById('text').style.opacity='1';console.error(e)}
</script></body></html>
